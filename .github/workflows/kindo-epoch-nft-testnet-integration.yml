name: KINDO Epoch NFT Testnet integration (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_KINDO_EPOCH_NFT_TESTNET"
        required: true
        type: string
      existing_address:
        description: "Optional existing deployed NFT address to resume"
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    if: inputs.confirmation == 'RUN_KINDO_EPOCH_NFT_TESTNET'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: kindo-testnet-deploy
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: openvrf
          POSTGRES_USER: openvrf
          POSTGRES_PASSWORD: openvrf-ci-password
        options: >-
          --health-cmd "pg_isready -U openvrf -d openvrf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KINDO_TESTNET_OWNER_PRIVATE_KEY: ${{ secrets.KINDO_TESTNET_OWNER_PRIVATE_KEY }}
      PRIMARY_RELAYER_PRIVATE_KEY: ${{ secrets.KINDO_TESTNET_PRIMARY_RELAYER_PRIVATE_KEY }}
      BACKUP_RELAYER_PRIVATE_KEY: ${{ secrets.KINDO_TESTNET_BACKUP_RELAYER_PRIVATE_KEY }}
      KINDO_TESTNET_ALCHEMY_API_KEY: ${{ secrets.KINDO_TESTNET_ALCHEMY_API_KEY }}
      ROBINHOOD_TESTNET_RPC_URL: "https://rpc.testnet.chain.robinhood.com"
      ROUTER_ADDRESS: "0xe68c6bd57bc2497eccebb5bae5ae8e618b3daaaa"
      DATABASE_URL: "postgresql://openvrf:openvrf-ci-password@127.0.0.1:5432/openvrf"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official OpenVRF
        run: |
          git clone --depth 1 https://github.com/Robinhood-OSS/OpenVRF.git openvrf-upstream
          test -f openvrf-upstream/relayer/main.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Verify testnet secret and chain
        run: |
          test -n "$KINDO_TESTNET_OWNER_PRIVATE_KEY"
          test "$(cast chain-id --rpc-url "$ROBINHOOD_TESTNET_RPC_URL")" = "46630"
      - run: npm ci --ignore-scripts
      - name: Install OpenVRF relayer dependencies
        working-directory: openvrf-upstream
        run: npm ci --ignore-scripts
      - name: Compile
        run: npx hardhat compile
      - name: Deploy KindoEpochOpenVRFNFT
        if: inputs.existing_address == ''
        run: |
          npx hardhat run scripts/nft/deploy-kindo-epoch-testnet.ts --network robinhoodTestnet | tee epoch-deployment.log
          line=$(awk '/"deployedAddress"/{v=$0} END{print v}' epoch-deployment.log)
          test -n "$line"
          address=$(node -e 'const j=JSON.parse(process.argv[1]); if (!j.deployedAddress || !/^0x[0-9a-fA-F]{40}$/.test(j.deployedAddress)) process.exit(2); process.stdout.write(j.deployedAddress)' "$line")
          test -n "$address"
          test "${#address}" -eq 42
          echo "KINDO_EPOCH_NFT_ADDRESS=$address" >> "$GITHUB_ENV"
          echo "deployed_address=$address" >> "$GITHUB_OUTPUT"
        id: deploy
      - name: Use existing KindoEpochOpenVRFNFT
        if: inputs.existing_address != ''
        env:
          RESUME_ADDRESS: ${{ inputs.existing_address }}
        run: |
          address="$RESUME_ADDRESS"
          test -n "$address"
          test "${#address}" -eq 42
          node -e 'const a=process.argv[1]; if (!/^0x[0-9a-fA-F]{40}$/.test(a)) process.exit(2)' "$address"
          echo "KINDO_EPOCH_NFT_ADDRESS=$address" >> "$GITHUB_ENV"
          printf '%s\n' "{\"deployedAddress\":\"$address\",\"source\":\"existing-input\"}" > epoch-deployment.log
      - name: Start OpenVRF relayers
        shell: bash
        run: |
          mkdir -p openvrf-upstream/secrets
          printf '%s' "$PRIMARY_RELAYER_PRIVATE_KEY" > openvrf-upstream/secrets/primary-key
          printf '%s' "$BACKUP_RELAYER_PRIVATE_KEY" > openvrf-upstream/secrets/backup-key
          START_BLOCK=$(($(cast block-number --rpc-url "$ROBINHOOD_TESTNET_RPC_URL") - 10000))
          export RPC_URL="$ROBINHOOD_TESTNET_RPC_URL" WS_URL="wss://robinhood-testnet.g.alchemy.com/v2/$KINDO_TESTNET_ALCHEMY_API_KEY" CHAIN_ID=46630 ROUTER_ADDRESS="$ROUTER_ADDRESS" RELAY_ALL_CONSUMERS=true RELAYER_ADDRESSES="0x1BB3884AE2C2a27dEc3aB537F93cFE4961344401,0xE50Ca16E7f0bdd7a7F47d1B1A8AD0c9d63037305" DATABASE_URL="$DATABASE_URL" START_BLOCK="$START_BLOCK" RELAYER_FAILOVER_SECONDS=60 RELAYER_LEASE_SECONDS=120 RECEIPT_TIMEOUT_SECONDS=30 MAX_GAS_PRICE_GWEI=1000
          (RELAYER_KEY_FILE="$GITHUB_WORKSPACE/openvrf-upstream/secrets/primary-key" cd openvrf-upstream && node relayer/main.mjs > ../primary-relayer.log 2>&1) &
          (RELAYER_KEY_FILE="$GITHUB_WORKSPACE/openvrf-upstream/secrets/backup-key" cd openvrf-upstream && node relayer/main.mjs > ../backup-relayer.log 2>&1) &
          sleep 8
      - name: Run KindoEpochOpenVRFNFT integration
        run: npx hardhat run scripts/nft/run-kindo-epoch-testnet.ts --network robinhoodTestnet
      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindo-epoch-nft-testnet-evidence
          path: epoch-deployment.log
          if-no-files-found: ignore
